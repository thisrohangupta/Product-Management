pipeline:
  name: PM_Signoff
  identifier: PM_Signoff_cursor3
  projectIdentifier: PM_Signoff
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: Deploy
        identifier: Deploy
        type: Deployment
        spec:
          serviceConfig:
            service:
              serviceRef: <+input>
              name: <+input>
              identifier: <+input>
            serviceDefinition:
              type: Kubernetes
              spec:
                manifests: []
          infrastructure:
            environmentRef: <+input>
            infrastructureRef: <+input>
            infrastructureDefinition:
              type: KubernetesDirect
              spec:
                connectorRef: <+input>
                namespace: <+input>
                releaseName: <+input>
          execution:
            strategy:
              type: Canary
              spec:
                instanceSelection:
                  type: Count
                  spec:
                    count: 1
            steps:
              - stepGroup:
                  name: Canary
                  identifier: canary
                  steps:
                    - step:
                        type: K8sCanaryDeploy
                        name: Canary Deploy
                        identifier: Canary_Deploy
                        spec:
                          skipDryRun: false
                          instanceSelection:
                            type: Count
                            spec:
                              count: 1
                        timeout: 10m
                    - step:
                        type: K8sCanaryDelete
                        name: Canary Delete
                        identifier: Canary_Delete
                        spec: {}
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
              - stepGroup:
                  name: Primary
                  identifier: primary
                  steps:
                    - step:
                        type: K8sRollingDeploy
                        name: Rolling Deploy
                        identifier: Rolling_Deploy
                        spec: {}
                        timeout: 10m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
